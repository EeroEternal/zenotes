[package]
name = "desktop-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# gpui and zed_ui are evolving fast; use git deps, optional feature
gpui   = { git = "ssh://git@github.com/zed-industries/zed.git", package = "gpui",   optional = true }
ui_input = { git = "ssh://git@github.com/zed-industries/zed.git", version = "0.1.0", optional = true }
editor = { git = "ssh://git@github.com/zed-industries/zed.git", package = "editor", optional = true }
settings = { git = "ssh://git@github.com/zed-industries/zed.git", version = "0.1.0" }

[features]
# Enable the GPUI window by: cargo run -p desktop-gpui --features gpui
# Default build does not pull gpui to avoid toolchain issues.
default = []
gpui = ["dep:gpui"]
ui_input = ["dep:ui_input", "dep:editor"]

[build-dependencies]

