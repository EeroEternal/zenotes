# Migrate PostgreSQL (users / notes) to Cloudflare R2 + D1.
# Only run manually to avoid triggering production migrations on every push.
#
# Prerequisites:
# - GitHub Actions must have access to the PostgreSQL database (public access + security group allow-list Actions IPs, or use a self-hosted runner within your VPC).
# - If the database is internal-only, this workflow will fail on ubuntu-latest; execute on a runner with network access.
#
# Configure in Repository Settings → Secrets and variables → Actions:
# - DATABASE_URL              PostgreSQL connection string
# - R2_ACCOUNT_ID             Cloudflare Account ID
# - R2_ACCESS_KEY_ID          R2 API Token Access Key
# - R2_SECRET_ACCESS_KEY      R2 API Token Secret
# - CLOUDFLARE_API_TOKEN      Must have D1 write permissions (used by wrangler d1 execute)
# Optional:
# - R2_BUCKET                 Default: zenotes-bodies
# - CLOUDFLARE_ACCOUNT_ID     Optional, required for multi-account setups
# - TARGET_USER_ID            Default: 1
# - D1_DATABASE_NAME          Default: zenotes-db

name: Migrate Postgres to Cloudflare (D1 + R2)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Migrate to R2 and generate D1 SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TARGET_USER_ID: ${{ secrets.TARGET_USER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then echo "Missing secret DATABASE_URL"; exit 1; fi
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "Missing R2 secrets (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY)"; exit 1;
          fi
          export R2_BUCKET="${R2_BUCKET:-zenotes-bodies}"
          export TARGET_USER_ID="${TARGET_USER_ID:-1}"
          node scripts/migrate-from-postgres.mjs

      - name: Apply SQL to remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "Missing secret CLOUDFLARE_API_TOKEN"; exit 1; fi
          DBNAME="${D1_DATABASE_NAME:-zenotes-db}"
          npx wrangler d1 execute "$DBNAME" --remote --file=out/migration/d1-import.sql
