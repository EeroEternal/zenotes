# 将 PostgreSQL（users / notes）迁到 Cloudflare R2 + D1。
# 仅手动运行，避免每次 push 触发生产迁移。
#
# 前提：
# - GitHub Actions 能连上该 PostgreSQL（公网 + 安全组放行 Actions IP，或使用 self-hosted runner 在 VPC 内）。
# - 若库仅内网可达，本 workflow 在 ubuntu-latest 上会失败，须在能进内网的 runner 上执行。
#
# 在仓库 Settings → Secrets and variables → Actions 中配置：
# - DATABASE_URL              PostgreSQL 连接串
# - R2_ACCOUNT_ID             Cloudflare 账户 ID
# - R2_ACCESS_KEY_ID          R2 API 令牌 Access Key
# - R2_SECRET_ACCESS_KEY     R2 API 令牌 Secret
# - CLOUDFLARE_API_TOKEN     需含 D1 写权限（用于 wrangler d1 execute）
# 可选：
# - R2_BUCKET                 默认 mynotes-bodies
# - CLOUDFLARE_ACCOUNT_ID     多账户时可显式指定（多数情况不必）
# - TARGET_USER_ID            默认 1
# - D1_DATABASE_NAME          默认 mynotes-db

name: Migrate Postgres to Cloudflare (D1 + R2)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Migrate to R2 and generate D1 SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TARGET_USER_ID: ${{ secrets.TARGET_USER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then echo "Missing secret DATABASE_URL"; exit 1; fi
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "Missing R2 secrets (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY)"; exit 1;
          fi
          export R2_BUCKET="${R2_BUCKET:-mynotes-bodies}"
          export TARGET_USER_ID="${TARGET_USER_ID:-1}"
          node scripts/migrate-from-postgres.mjs

      - name: Apply SQL to remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "Missing secret CLOUDFLARE_API_TOKEN"; exit 1; fi
          DBNAME="${D1_DATABASE_NAME:-mynotes-db}"
          npx wrangler d1 execute "$DBNAME" --remote --file=out/migration/d1-import.sql
