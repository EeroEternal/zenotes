name: Deploy MyNotes

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 进入项目目录 (请根据您的服务器实际路径修改)
            cd /www/wwwroot/mynotes 
            
            # 拉取最新代码
            git pull origin main
            
            # 1. 编译并重启后端 (Actix-web)
            # 假设您使用 systemd 管理服务，服务名为 mynotes-backend
            cd backend
            cargo build --release
            # sudo systemctl restart mynotes-backend
            
            # 2. 编译前端 (Vite)
            # 假设 Nginx 指向了 frontend/dist 目录
            cd ../frontend
            npm install
            npm run build
            
            # 提示：Nginx 反向代理通常配置如下（已经在服务器上配置好）：
            # location /api {
            #     proxy_pass http://127.0.0.1:3035;
            # }
            # location /static {
            #     proxy_pass http://127.0.0.1:3035/static;
            # }
            # location / {
            #     root /www/wwwroot/mynotes/frontend/dist;
            #     try_files $uri $uri/ /index.html;
            # }
