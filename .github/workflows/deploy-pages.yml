# 构建 frontend 部署到 Cloudflare Pages，并部署 Cloudflare Worker（api.zenotes.site）
#
# 仓库 Settings → Secrets → Actions 需配置：
#   CLOUDFLARE_API_TOKEN   需含 Workers 与 Pages 写权限
#   VITE_API_BASE          例如 https://api.zenotes.site/api
# 可选：
#   PAGES_PROJECT_NAME     默认 mynotes-web（生产域名 zenotes.site）

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        run: npm ci
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::请在仓库 Secrets 中设置 CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          npx wrangler@4 deploy

  pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: |
          if [ -z "${VITE_API_BASE:-}" ]; then
            echo "::error::请在仓库 Secrets 中设置 VITE_API_BASE（例如 https://api.zenotes.site/api）"
            exit 1
          fi
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT_NAME: ${{ secrets.PAGES_PROJECT_NAME }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::请在仓库 Secrets 中设置 CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          PROJECT="${PAGES_PROJECT_NAME:-mynotes-web}"
          npx wrangler@4 pages deploy dist --project-name="$PROJECT"
